allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects { subproject ->
    afterEvaluate {
        if (subproject.hasProperty('android')) {
            subproject.android {
                compileSdkVersion 34
            }
        }
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
            force 'androidx.fragment:fragment:1.7.1'
            force 'androidx.activity:activity:1.8.1'
            force 'androidx.recyclerview:recyclerview:1.3.2'
            force 'androidx.customview:customview:1.1.0'
            force 'androidx.viewpager:viewpager:1.0.0'
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
